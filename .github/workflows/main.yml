name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: |
          if [ -f schedule_android_project.zip ]; then
            unzip -q schedule_android_project.zip -d proj
            echo "PROJ=proj" >> "$GITHUB_ENV"
          else
            echo "PROJ=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
